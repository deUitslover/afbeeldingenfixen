<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afbeeldingen fixen</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 20px auto; padding: 0 16px; background: #f5f5f7; color: #1d1d1f; }
  h1 { font-size: 20px; }
  p { font-size: 14px; line-height: 1.5; color: #444; }
  input[type=password] { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; margin-top: 6px; }
  button { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border: none; border-radius: 8px; margin-top: 16px; cursor: pointer; }
  #runBtn { background: #007aff; color: white; }
  #runBtn:disabled { background: #999; }
  ul { font-size: 13px; color: #555; }
  #log { margin-top: 20px; background: #000; color: #0f0; font-family: monospace; font-size: 12px; padding: 12px; border-radius: 8px; white-space: pre-wrap; min-height: 40px; max-height: 400px; overflow-y: auto; }
</style>
</head>
<body>

<h1>Oude afbeeldingen vervangen door -fixed versies</h1>
<p>Vul je <strong>service_role key</strong> in. Deze wordt nergens opgeslagen, alleen gebruikt zolang deze pagina open staat.</p>

<input type="password" id="keyInput" placeholder="service_role key">

<p><strong>Dit gaat er gebeuren:</strong></p>
<ul id="fileList"></ul>

<label style="display:flex; align-items:center; gap:8px; margin-top:16px; font-size:14px;">
  <input type="checkbox" id="confirmCheck" style="width:20px; height:20px;">
  Ik snap dat dit de 8 oude bestanden permanent verwijdert
</label>

<button id="runBtn" disabled>Verwijder oude bestanden + hernoem fixed bestanden</button>

<div id="log">Wachten op start...</div>

<script>
const SUPABASE_URL = "https://rfyffbietarhprlbvdek.supabase.co";
const BUCKET = "practice-question-images";

const files = [
  "natuurkunde-vwo-2016-i-gekleurde-leds-vraag1.png",
  "natuurkunde-vwo-2016-i-ruimtelift-vraag5.png",
  "natuurkunde-vwo-2016-i-ruimtelift-vraag9.png",
  "natuurkunde-vwo-2016-ii-buiging-bij-een-enkelspleet-vraag22.png",
  "natuurkunde-vwo-2016-ii-thalliumscintigrafie-vraag11.png",
  "natuurkunde-vwo-2016-ii-jupiter-fly-by-vraag12.png",
  "natuurkunde-vwo-2017-i-inwendige-bestraling-context4.png",
  "natuurkunde-vwo-2017-i-cessna-context6.png",
];

const listEl = document.getElementById("fileList");
files.forEach(f => {
  const li = document.createElement("li");
  li.textContent = f + " ← " + f.replace(".png", "-fixed.png");
  listEl.appendChild(li);
});

const logEl = document.getElementById("log");
function log(msg) {
  logEl.textContent += "\n" + msg;
  logEl.scrollTop = logEl.scrollHeight;
}

document.getElementById("confirmCheck").addEventListener("change", (e) => {
  document.getElementById("runBtn").disabled = !e.target.checked;
});

document.getElementById("runBtn").addEventListener("click", async () => {
  const key = document.getElementById("keyInput").value.trim();
  if (!key) { log("FOUT: vul eerst je service_role key in."); return; }

  const btn = document.getElementById("runBtn");
  btn.disabled = true;
  logEl.textContent = "Bezig...";

  const headers = {
    "Authorization": "Bearer " + key,
    "apikey": key,
    "Content-Type": "application/json",
  };

  try {
    log("Stap 1: oude bestanden verwijderen...");
    const delRes = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}`, {
      method: "DELETE",
      headers,
      body: JSON.stringify({ prefixes: files }),
    });
    log("Verwijderen status: " + delRes.status);
    log(await delRes.text());

    log("\nStap 2: fixed bestanden hernoemen...");
    for (const file of files) {
      const fixedName = file.replace(".png", "-fixed.png");
      const moveRes = await fetch(`${SUPABASE_URL}/storage/v1/object/move`, {
        method: "POST",
        headers,
        body: JSON.stringify({
          bucketId: BUCKET,
          sourceKey: fixedName,
          destinationKey: file,
        }),
      });
      log(`${fixedName} -> ${file}: status ${moveRes.status} ${await moveRes.text()}`);
    }

    log("\nKlaar! Controleer of alle stappen status 200 hadden.");
  } catch (e) {
    log("FOUT: " + e.name + " - " + e.message);
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
